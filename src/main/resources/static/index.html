<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support request</title>
<style>body{max-width:640px;margin:60px auto;padding:24px;font:17px/1.5 system-ui;background:#f4f7fa;color:#182b3f}label{display:block;margin:16px 0}input,textarea,button{font:inherit;padding:10px;box-sizing:border-box;width:100%}button{background:#234a70;color:white;border:0;border-radius:5px}pre{white-space:pre-wrap}</style>
<h1>Send a support request</h1><p>Describe the issue and keep your reference number. This is a demo intake form, not a staffed helpdesk.</p>
<form><label>Name<input name="name" required maxlength="100"></label><label>Email<input name="email" type="email" required maxlength="254"></label><label>Subject<input name="subject" required minlength="3" maxlength="150"></label><label>Message<textarea name="message" required minlength="10" maxlength="2000"></textarea></label><button>Submit request</button></form><pre role="status" id="result"></pre><p><a href="/admin">Operator records</a> · <a href="/openapi.json">API schema</a></p>
<script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();let b=e.target.querySelector('button');b.disabled=true;try{let r=await fetch('/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});let v=await r.json();document.querySelector('#result').textContent=r.ok?`Saved request ${v.id}. Email state: ${v.email_status}.`: `Request rejected (${r.status}). Check the fields or try later.`;if(r.ok)e.target.reset()}catch{document.querySelector('#result').textContent='Could not confirm submission. Check with the operator before retrying.'}finally{b.disabled=false}};</script></html>
